[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubrat"
version = "0.1.0"
description = "Reproducible real/bogus classification for Roman RAPID products"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "astropy==7.2.0",
  "matplotlib==3.10.9",
  "numpy==2.4.4",
  "pandas==3.0.2",
  "pyarrow==24.0.0",
  "PyYAML>=6.0",
  "scipy==1.17.1",
  "tensorflow==2.20.0",
  "tqdm==4.67.3",
]

[project.optional-dependencies]
workflow = ["snakemake>=8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]

[project.scripts]
rubrat = "rubrat.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rubrat*", "classification*", "ingestion*", "rubr_compat*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
