# The contract tier in CI: PostgreSQL built from the authoritative migration
# stream, then the PostgreSQL-backed suite against it (rule 23).
#
# THIS IS THE rapid REPO'S FIRST GITHUB ACTIONS WORKFLOW. Its shape follows
# the conventions already proven in the sibling infrastructure repo
# (rapid_systems/.github/workflows): every action SHA-pinned, least-privilege
# permissions, no self-hosted runners, no AWS credentials.
#
# ---------------------------------------------------------------------------
# THE OWNER PROVISIONING STEP (brief B: "provisioning the repo secret is an
# owner step outside this brief").
#
#   Secrets:      RAPID_SYSTEMS_APP_ID          (GitHub App ID; not secret, kept
#                                                beside the key for one gate)
#                 RAPID_SYSTEMS_APP_PRIVATE_KEY (the App's RS256 private key, PEM)
#   The App:      `rapid-ci-promoter`, owned by IPAC-SW, installed on
#                 IPAC-SW/rapid_systems only, repository permissions read-only
#                 Actions / Attestations / Contents (ISG-185028, 2026-08-10).
#                 The same App and key serve the AWS-side promoter
#                 (rapid_systems/cloudformation/rapid-ci-promoter.yaml, key in
#                 Secrets Manager `rapid/ci/github-app-fetch`); the master copy
#                 is the .pem in the shared 1Password vault "IPAC RAPID".
#   Set with:     gh secret set RAPID_SYSTEMS_APP_ID --repo Caltech-IPAC/rapid --body <id>
#                 op read 'op://<vault>/<item>/<file>.pem' \
#                   | gh secret set RAPID_SYSTEMS_APP_PRIVATE_KEY --repo Caltech-IPAC/rapid
#   History:      2026-08-11 → 2026-08-19 a fine-grained PAT
#                 (RAPID_SYSTEMS_READ_TOKEN) did this job; it died with the
#                 owner's PAT clean-up after the App migration and the tier ran
#                 red for 16 days. The App token replaced it 2026-09-04.
#
# WHY A SECRET IS NEEDED AT ALL: Caltech-IPAC/rapid is PUBLIC and
# IPAC-SW/rapid_systems is PRIVATE, in a different organization. The
# workflow's own GITHUB_TOKEN is scoped to this repository and cannot read
# across that boundary, so the authoritative migration stream is unreachable
# without a credential the owner provisions. That credential is a GitHub App
# installation token: minted per run from the App's private key, scoped to one
# repository and one permission, valid for one hour, revoked at job end.
#
# THE WORKFLOW NEVER EMBEDS OR CHOOSES THE CREDENTIAL. It reads two named
# secrets, mints the narrowest token they allow, and passes that to
# `actions/checkout`. Nothing here defaults a token, and a run without the
# secrets FAILS CLOSED at a named step
# rather than silently testing against a schema it built some other way — a
# green run against a vendored copy of the migrations would be exactly the
# false substrate this whole tier exists to eliminate.
#
# ---------------------------------------------------------------------------
# PR-GATING (D4, process-hardening campaign, 2026-08-13): PROPOSED, NOT
# RATIFIED. `on:` below still fires on `push` to smdc and manual dispatch
# only — this workflow does not gate pull requests today, and the decision
# below is to LEAVE IT THAT WAY for now rather than add `pull_request` here.
#
# Reasoning, weighed conservative-by-default per this run's own instruction
# (unattended, no one to catch a wrong call before it starts blocking PRs):
#
#   * Caltech-IPAC/rapid is PUBLIC (verified live: `gh repo view` reports
#     visibility PUBLIC). A `pull_request`-triggered run from a FORK gets no
#     access to repository secrets by default — the App secrets
#     would be absent, and this workflow's own "fail closed if the cross-org
#     read secret is not provisioned" step would then fail EVERY fork PR,
#     always, for a reason that has nothing to do with the PR's own change.
#     A required check that a class of legitimate contributor can never pass
#     is worse than no check.
#   * The safe way to hand secrets to a `pull_request`-shaped run is
#     `pull_request_target` (runs in the base repo's context, secrets
#     available) — but it runs with the BASE branch's workflow file against
#     the PR's head content, and mishandling that split is exactly how
#     `pull_request_target` gets a fork PR arbitrary secret access; not a
#     change to make unattended, and not evaluated in this pass.
#   * No PR-triggered run history exists yet to gauge flakiness or runtime
#     under PR concurrency — this is genuinely THIS repo's first Actions
#     workflow (see header above), proven on `push` only so far.
#
# Revisit once: (a) push-triggered runs have a track record, and (b) a
# pull_request_target design (or an org policy restricting who may open PRs)
# closes the fork-secret gap above. Until then this stays a `push` gate —
# reversible, and this comment is the record of why, per this campaign's
# ledger (wave-d).
name: contract-tests

on:
  push:
    branches: [smdc]
  workflow_dispatch:

# Least privilege: the job reads this repo's code and writes issues — the
# two red/green steps at the end open and close the `ci-red` issue with
# the job's own token. The cross-org read is the App installation token's,
# not this token's.
permissions:
  contents: read
  issues: write

concurrency:
  group: contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    # No step here does genuinely unbounded work (the longest is the
    # contract suite itself against a service-container Postgres), so the
    # GitHub Actions default of 6h is a runaway-job budget, not a real one.
    # 60 is generous headroom over any observed run and cheap insurance
    # against a hung step burning the whole default.
    timeout-minutes: 60

    # POSTGRESQL 18 + Q3C, MATCHING THE FLEET — not the stock postgres image.
    #
    # The deployed database is PostgreSQL 18 with the Q3C spherical-indexing
    # extension (rapid_systems/containers/rapid-postgres/Containerfile, on
    # which rapid-db's quadlet is pinned), and `003-q3c-and-partition-grant
    # .sql` does `CREATE EXTENSION IF NOT EXISTS q3c` — so the stream simply
    # does not apply to an image without it. Testing against a PostgreSQL the
    # fleet does not run would make every result here a statement about a
    # database nobody deploys.
    #
    # The image is BUILT IN THIS JOB from the same base and the same PGDG
    # package rapid_systems builds from, rather than pulled from that repo's
    # ECR: this workflow holds no AWS credentials by design, and adding them
    # to reach a registry would be a far larger change than adding a package
    # to a container. The base is digest-pinned; the q3c package tracks PGDG
    # for the same reason rapid_systems' own pin does (PGDG drops superseded
    # versions, so a stale pin fails loudly rather than silently drifting).
    services:
      postgres:
        image: postgres:18@sha256:b913fd5699b8bd23fa4b06d72ecdd939fad43b80fb8651bac06caa0e6d135cac
        env:
          POSTGRES_PASSWORD: contract-tier
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: contract-tier
      PGDATABASE: rapid
      # The revision of the migration stream this run consumed. Recorded in
      # the run's own log as evidence: "record the revision used" is part of
      # the required outcome, and a run that cannot say which schema it tested
      # against has not demonstrated anything reproducible.
      RAPID_SYSTEMS_REF: 165692b3b0bf955807b59b525013b5419cd79b99

    steps:
      - name: check out rapid
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: install Q3C into the service container
        # The service container is the stock postgres:18 image; Q3C is added
        # here, from the SAME PGDG repository the base image already has
        # configured and that rapid_systems' own image builds from. Installing
        # into the running container rather than building a derived image
        # keeps this workflow free of a registry and of any credential to one.
        run: |
          set -euo pipefail
          cid=$(docker ps --filter "ancestor=postgres:18" --format '{{.ID}}' | head -1)
          if [ -z "$cid" ]; then
            cid=$(docker ps --format '{{.ID}} {{.Image}}' | grep -i postgres | head -1 | cut -d' ' -f1)
          fi
          echo "BRIEF-B-PG-CONTAINER: $cid"
          docker exec "$cid" apt-get update -qq
          docker exec "$cid" apt-get install -y --no-install-recommends postgresql-18-q3c
          echo "BRIEF-B-Q3C: PASS exit=0"

      - name: set up python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: install postgresql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: install the package (required outcome 3)
        # `pip install -e .` IS an acceptance criterion, so it is a step whose
        # failure fails the run — not a convenience for the steps after it.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[test]'
          echo "BRIEF-B-INSTALL: PASS exit=0"

      - name: entry points launch
        # The console scripts must EXIST and be importable. They are run with
        # no configuration, so each is expected to fail on its own missing
        # environment — what is asserted is that the shim resolved and the
        # module imported, which is what `pip install -e .` is being trusted
        # for. A shim that could not import would fail differently, with a
        # traceback naming the import.
        #
        # ALL FIVE DECLARED ENTRY POINTS, which until brief E was three.
        # `pyproject.toml` has declared `rapidctl` since brief G and this loop
        # never named it — a latent gap, not a deliberate exclusion: the one
        # thing this step exists to prove is that every console script a wheel
        # declares can actually be executed, and a declared-but-unchecked
        # entry point is exactly the "scaffold is not a deployment" defect it
        # is guarding against. E closes it and adds its own `rapid-publisher`.
        run: |
          set +e
          for cmd in rapid-reconciler rapid-operator rapid-job rapidctl rapid-publisher; do
            command -v "$cmd" >/dev/null || { echo "BRIEF-B-ENTRYPOINT-$cmd: FAIL exit=1 (not installed)"; exit 1; }
            out=$("$cmd" --help 2>&1); rc=$?
            echo "BRIEF-B-ENTRYPOINT-$cmd: resolved exit=$rc"
            printf '%s\n' "$out" | grep -qi 'ModuleNotFoundError\|ImportError' && {
              echo "BRIEF-B-ENTRYPOINT-$cmd: FAIL exit=1 (import error)"
              printf '%s\n' "$out" | tail -20
              exit 1
            }
          done
          echo "BRIEF-B-ENTRYPOINTS: PASS exit=0"

      - name: the stubbed tier stays green, unchanged
        # Required outcome 3: "Keep the stubbed tier running unchanged during
        # the transition." Run here as well as on rapid-admin so a packaging
        # change that breaks the stub tier's per-module interpreter isolation
        # is caught by the same gate that introduced it.
        #
        # RAPID_SW is the installed software root. It is read fail-loud (no
        # compiled-in default — `scripts/check-env-policy.sh` enforces that),
        # because the science configuration is release content and must come
        # from the installed tree rather than be guessed from the working
        # directory. `run-operational-tests-on-rapid-admin.sh` sets it for the
        # same reason; a checkout-rooted run sets it to the checkout.
        env:
          RAPID_SW: ${{ github.workspace }}
        run: |
          scripts/run-operational-tests.sh

      - name: fail closed if the cross-org read secret is not provisioned
        # A NAMED FAILURE, NOT A CONFUSING ONE. Without this step the run
        # fails inside `actions/checkout` with a generic "repository not
        # found", which reads as a typo in the repo name rather than as the
        # one provisioning step this workflow documents.
        #
        # PLACED AS LATE AS IT CAN BE, immediately before the one step that
        # genuinely needs the secret. Everything above — the Q3C install, the
        # editable install, the entry points, the stubbed tier — needs no
        # cross-org read, so ordering the gate last means a secretless run
        # still proves all of it and stops at exactly one named, expected
        # place. A gate at the top would have made every one of those steps
        # unverifiable until the day the secret lands, and "it will presumably
        # work once someone provisions the token" is not evidence.
        #
        # The secret is tested through an `env:` binding rather than
        # `${{ secrets.* }}` inside an `if:`. The `secrets` context is not
        # available to step-level `if` expressions — a workflow using it
        # there does not merely skip the step, it fails to PARSE, and an
        # unparseable workflow produces a run with no jobs and no annotation
        # (verified live on this branch, run 31443363996).
        env:
          RAPID_SYSTEMS_APP_ID: ${{ secrets.RAPID_SYSTEMS_APP_ID }}
          RAPID_SYSTEMS_APP_PRIVATE_KEY: ${{ secrets.RAPID_SYSTEMS_APP_PRIVATE_KEY }}
        run: |
          if [ -n "${RAPID_SYSTEMS_APP_ID:-}" ] && [ -n "${RAPID_SYSTEMS_APP_PRIVATE_KEY:-}" ]; then
            echo "BRIEF-B-SECRET: PASS exit=0 (RAPID_SYSTEMS_APP_ID and RAPID_SYSTEMS_APP_PRIVATE_KEY are set)"
            exit 0
          fi
          echo "BRIEF-B-SECRET: FAIL exit=1 (RAPID_SYSTEMS_APP_ID and/or RAPID_SYSTEMS_APP_PRIVATE_KEY is not set)"
          echo "The migration stream lives in the PRIVATE repo IPAC-SW/rapid_systems."
          echo "Provision both secrets from the GitHub App rapid-ci-promoter (see the"
          echo "header of this workflow):"
          echo "  gh secret set RAPID_SYSTEMS_APP_ID --repo Caltech-IPAC/rapid --body <id>"
          echo "  gh secret set RAPID_SYSTEMS_APP_PRIVATE_KEY --repo Caltech-IPAC/rapid < key.pem"
          exit 1

      - name: mint a read-only installation token for the migration stream
        # Scoped as narrowly as the App allows: one repository, contents:read,
        # one hour. The action revokes the token in a post step; nothing below
        # persists it (checkout runs with persist-credentials: false).
        id: rapid-systems-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RAPID_SYSTEMS_APP_ID }}
          private-key: ${{ secrets.RAPID_SYSTEMS_APP_PRIVATE_KEY }}
          owner: IPAC-SW
          repositories: rapid_systems
          permission-contents: read

      - name: check out the authoritative migration stream (pinned)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: IPAC-SW/rapid_systems
          # PINNED BY REVISION, never a branch name: the schema under test
          # must be a stated fact, so a rerun of this workflow tests the same
          # schema and a change of schema is a change to this file. Written
          # as a literal rather than `${{ env.* }}`: the `env` context is not
          # guaranteed to a `with:` input, and a ref that silently resolved
          # to empty would check out the default branch — testing against an
          # unpinned schema while claiming a pinned one.
          ref: 165692b3b0bf955807b59b525013b5419cd79b99
          token: ${{ steps.rapid-systems-token.outputs.token }}
          path: rapid_systems
          persist-credentials: false

      - name: record the migration-stream revision
        # ALSO THE DRIFT GUARD: this literal and the RAPID_SYSTEMS_REF env
        # var above are the same fact written twice (the literal because
        # `with:` inputs can't trust the env context — see the checkout
        # step's comment; the env var because the suite records it as
        # evidence). Two copies can drift, and a drifted pair is worse than
        # either alone: the run's log then claims a schema it never tested
        # (this happened — a bump of the env var alone recorded 1cdce67
        # while the tier ran 28ea260's schema). Fail loudly instead.
        run: |
          cd rapid_systems
          echo "BRIEF-B-RAPID-SYSTEMS-REV: $(git rev-parse HEAD)"
          if [ "$(git rev-parse HEAD)" != "$RAPID_SYSTEMS_REF" ]; then
            echo "PIN DRIFT: checkout ref $(git rev-parse HEAD) != RAPID_SYSTEMS_REF $RAPID_SYSTEMS_REF" >&2
            echo "Update BOTH the checkout step's ref literal and env.RAPID_SYSTEMS_REF together." >&2
            exit 1
          fi
          ls cloudformation/db-migrations/*.sql | wc -l

      - name: run the contract suite against the applied stream
        run: |
          scripts/run-contract-tests.sh rapid_systems/cloudformation/db-migrations

      # ---------------------------------------------------------------------
      # RED/GREEN INTO THE PLACE THE TEAM LOOKS (2026-09-04). GitHub's own
      # failure notification goes to the account that triggered the run,
      # by that person's notification settings, and to nobody else — which
      # is how this workflow ran red for 16 days (2026-08-19 → 09-04)
      # unseen by anyone who acted. On failure, open (or update) ONE issue
      # labelled `ci-red`; on success, close it. Repo-scoped GITHUB_TOKEN,
      # no new secret; `failure()` excludes cancelled runs, so the
      # cancel-in-progress concurrency above never files an issue for a
      # superseded run. Deliberately one issue, updated, not one per red
      # run: the issue is the conversation, the comments are the history.
      # The ops ledger's `ci-actions-rapid` check (rapid_systems
      # verify-live.sh) watches this workflow daily as the complement —
      # this step is the fast path, that one is the escalating one.
      - name: red → open or update the ci-red issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh label create ci-red --color B60205 \
            --description "A CI workflow is red on the working branch; opened and closed by the workflow itself" \
            2>/dev/null || true
          existing=$(gh issue list --label ci-red --state open --json number --jq '.[0].number // empty')
          body="contract-tests is red on \`${BRANCH}\` at ${HEAD_SHA:0:8}: ${RUN_URL}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still red — ${body}"
            echo "CI-RED: updated issue #$existing"
          else
            gh issue create --label ci-red \
              --title "contract-tests red on ${BRANCH}" \
              --body "$(printf '%s\n\n%s\n\n%s' \
                "$body" \
                "The contract tier (rapid_systems migration stream applied to PostgreSQL 18 + Q3C, then the rule-23 suite) failed. Open the run, read the first red step; if it is the credential gate or the token mint, see the header of .github/workflows/contract-tests.yml." \
                "This issue is opened and closed by the workflow itself: the next green run on ${BRANCH} closes it.")"
            echo "CI-RED: opened a new issue"
          fi

      - name: green → close any open ci-red issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --label ci-red --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Green again on \`${BRANCH}\` at ${HEAD_SHA:0:8}: ${RUN_URL}"
            echo "CI-RED: closed issue #$n"
          done
          echo "CI-RED: none open" 

