# foundation: applies database/schema.sql, the one foundation schema
# (foundation plan v5, Part 1), to an empty PostgreSQL 18 with Q3C and runs
# every test that needs a database against it: tests/db (the schema, the
# operations and the procedure proof) and tests/cli (the five verbs).
name: foundation

on:
  push:
    branches: [rebuild]
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: throwaway-ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      # Throwaway password, this job's service container only, never a
      # real credential, never used outside this ephemeral database.
      PGPASSWORD: throwaway-ci-password

    steps:
      - name: check out rapid
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: install Q3C into the service container
        run: |
          set -euo pipefail
          cid=$(docker ps --filter "ancestor=postgres:18" --format '{{.ID}}' | head -1)
          if [ -z "$cid" ]; then
            cid=$(docker ps --format '{{.ID}} {{.Image}}' | grep -i postgres | head -1 | cut -d' ' -f1)
          fi
          docker exec "$cid" apt-get update -qq
          docker exec "$cid" apt-get install -y --no-install-recommends postgresql-18-q3c

      - name: install postgresql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: create the empty target database
        run: |
          PGDATABASE=postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE rapid"

      - name: apply the schema
        env:
          PGDATABASE: rapid
        run: |
          psql -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: install rapidpipe's dependencies and pytest
        run: |
          pip install -e . --no-deps
          pip install -r requirements.txt pytest

      - name: run the foundation tests against this database
        env:
          PGDATABASE: rapid
        run: |
          python -m pytest tests/db tests/cli -q -rs
