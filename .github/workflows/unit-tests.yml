# Runs the rapidpipe unit test suite on push and pull_request.
#
# pip install -e . --no-deps installs only the rapidpipe package under
# test, not its runtime dependencies (numpy/astropy/astroquery from
# requirements.txt) -- this workflow proves the package and its tests
# import and pass on their own, and stays fast; a stage that needs those
# runtime dependencies pulls them in when it is added.
#
# rapidpipe.db and rapidpipe.runs import psycopg2 unconditionally
# (mocked, never connected to, in tests/unit -- the database-backed
# tests are tests/db, run by db-migrations.yml against a real
# PostgreSQL), so this job installs psycopg2-binary by hand rather than
# widening --no-deps, matching the module the tests import and the
# install db-migrations.yml already does.
#
# numpy and astropy are also installed by hand, for the same reason:
# rapidpipe.stages.admit reads FITS headers and builds a WCS through
# astropy (and its tests build a FITS fixture with astropy/numpy) to
# admit a delivered l2 image, so this job's dependency set grows with it
# rather than widening --no-deps.
#
# healpy is installed the same way: rapidpipe.science.spatial (imported
# by rapidpipe.db.l2files, which rapidpipe.stages.register imports at
# module scope) computes HEALPix indexes with it, so collecting
# tests/unit -- not only running the database-backed spatial tests
# -- needs it importable.
#
# fastavro is installed the same way: the alerts stage and its science
# (rapidpipe.science.alerts) import it at module scope, and the alerts
# unit tests and stage fixture decode the container it writes. scipy
# comes with it: the alerts stage's reference-catalog and NED matches use
# astropy's match_to_catalog_sky, which builds its KD-tree with scipy (the
# pipeline image carries scipy through photutils; requirements.txt does not
# name it, as it does not name photutils).
#
# actions/checkout is pinned by SHA per this repo's existing convention
# (see .github/workflows/public-safety.yml); actions/setup-python is
# pinned the same way.
name: unit-tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: install rapidpipe
        run: pip install -e . --no-deps

      - name: install pytest, psycopg2-binary, numpy, astropy, healpy, fastavro and scipy
        run: pip install pytest psycopg2-binary numpy astropy healpy fastavro scipy

      - name: run rapidpipe unit tests
        run: python -m pytest tests/unit -q
