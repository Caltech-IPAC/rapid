# Runs the rapidpipe unit test suite on every pull request and on push to rebuild.
#
# pip install -e . --no-deps installs only the rapidpipe package under
# test; the runtime dependencies come from requirements.txt in the next
# step (the one dependency authority, which pyproject.toml also reads).
# rapidpipe.db and rapidpipe.foundation import psycopg2 unconditionally
# but tests/unit never connects: the database-backed tests are tests/db
# and tests/cli, run by foundation.yml against a real PostgreSQL.
#
# actions/checkout is pinned by SHA per this repo's existing convention
# (see .github/workflows/public-safety.yml); actions/setup-python is
# pinned the same way.
name: unit-tests

on:
  push:
    branches: [rebuild]
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: install rapidpipe
        run: pip install -e . --no-deps

      # requirements.txt is the one dependency authority (pyproject.toml
      # reads it); installing from it here keeps this list from drifting
      # from foundation.yml's.
      - name: install the runtime dependencies (requirements.txt) and pytest
        run: pip install -r requirements.txt pytest

      - name: run rapidpipe unit tests
        run: python -m pytest tests/unit -q
