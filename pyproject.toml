# Project, build and lint configuration for the RAPID repository.
#
# Created by W2 of the Batch payload co-design as a lint config alone, for one
# purpose: the adopted code standards ban print() from the operational layer
# and require it lint-enforced (ruff T201) on the converted modules.
#
# `[build-system]` and `[project]` were DELIBERATELY ABSENT until now, and this
# file's own header said so: "the payload design has that as W5's work
# (PYTHONPATH replaced by installing the package into the image environment).
# A lint config that quietly turned the repo into an installable distribution
# would be a change nobody asked for." That work is now asked for — brief B,
# required outcome 3 — so the declarations land here, in a change whose whole
# subject is packaging, rather than as a side effect of a lint edit. The
# original reasoning was about WHERE the change belonged, not whether it
# should ever happen, and this is that place.
#
# WHY THE BAN IS PER-PATH: the repo has 2,126 print() calls across the
# pipeline, modules, database and sims trees. A global T201 would fail on all
# of them and be switched off within a day. The ban therefore applies to the
# converted modules only, and grows one directory at a time as each is
# converted — W3 adds the payload scripts it converts, W5 the entrypoint. A
# rule that is enforced on a small area and expanding beats one that is
# declared everywhere and ignored.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rapid-pipeline"
version = "0.1.0"
description = "RAPID — Roman Alerts Promptly from Image Differencing"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}

# THE RUNTIME DEPENDENCIES ARE requirements.txt's, RESTATED, NOT REPLACED.
# requirements.txt stays: the Dockerfiles install from it, and moving the
# authority here would mean editing image builds this brief does not own.
# The cost of the duplication is that they can drift; the cost of not
# declaring them is that `pip install -e .` produces an installation that
# imports nothing, which is worse and is the thing this outcome exists to
# fix. `healpy`'s own comment in requirements.txt records what a missing
# undeclared dependency actually costs.
dependencies = [
    "numpy>=1.25",
    "fastavro",
    "kafka-python",
    "aws-msk-iam-sasl-signer-python",
    "boto3",
    "healpy",
    "psycopg2-binary",
    # UNDECLARED UNTIL NOW, and found the way healpy's own comment in
    # requirements.txt describes finding it: the entry-point launch check
    # imported `pipeline.entrypoints.job`, which pulls in the stage sequences,
    # which import `modules.utils.rapid_pipeline_subs`, which imports scipy.
    # Every one of these is imported by code the payload runs, and none was
    # declared anywhere — "installed in the Dockerfile and never written down"
    # is precisely the dependency that a fresh environment discovers at
    # runtime. Declared here rather than in requirements.txt because this is
    # the file that now defines what installing RAPID means; requirements.txt
    # stays as the image builds' input.
    "scipy",
    "astropy",
    "pandas",
    "photutils",
    "reproject",
]

[project.optional-dependencies]
# The contract tier's own needs, kept OUT of the runtime set: an image that
# runs payloads has no reason to carry pytest, and a test dependency that
# ships to production is how a test-only import ends up in an operational
# traceback.
test = ["pytest>=7"]

[project.scripts]
# The existing entrypoints, named as commands. Each maps to a `main()` this
# repo already had and already ran as `python3 -m <module>` — these are new
# NAMES for proven entrypoints, not new entrypoints, which is why every one
# of them is a bare `module:main` with no wrapper. The systemd units and job
# definitions that invoke `python3 -m ...` keep working unchanged; nothing is
# migrated onto these names by this change.
rapid-reconciler = "pipeline.reconciler.main:main"
rapid-operator = "pipeline.operator.service:main"
rapid-job = "pipeline.entrypoints.job:main"

[tool.setuptools]
# EXPLICIT PACKAGE LIST, NOT AUTO-DISCOVERY. Auto-discovery over this repo
# root finds `docs`, `sims`, `soc`, `c`, `RuBR` and several directories that
# are not importable packages at all, and setuptools' flat-layout detector
# refuses outright ("Multiple top-level packages discovered in a flat-layout")
# rather than guessing. Naming the four operational trees is also the honest
# statement of what "installing RAPID" means today: the modules the services
# and payloads import, not the whole working directory.
#
# `pipeline`, `database` and `modules` carry NO `__init__.py` (PEP 420
# namespace packages) while `observability` and `submission` do — hence
# `namespaces = true`, which handles both. Using plain `find` here silently
# drops the namespace trees and yields a wheel whose `import pipeline`
# fails, which is the exact failure mode this outcome is meant to end.
#
# `modules` IS LOAD-BEARING and was missing from the first version of this
# list: `pipeline/stages/post_db.py` does `import
# modules.utils.rapid_pipeline_subs`, so an installed distribution without it
# gives `ModuleNotFoundError: No module named 'modules'` the moment the job
# entrypoint imports its stage sequences — caught by the entry-point launch
# check on rapid-admin, which is precisely what that check is for. The
# science-algorithm subtrees (coadd, sfft, zogy, ...) come with it; they are
# what the payload's stages call into.
packages.find = {namespaces = true, include = [
    "pipeline*", "observability*", "submission*", "database*", "modules*",
    "alerts*",
]}

[tool.setuptools.package-data]
# The reviewed, checksummed workflow definitions must travel with the
# distribution: `pipeline.intent.definitions` reads them from the software
# root and verifies the sha256 of each file's BYTES against what is loaded in
# `workflow_definitions`. A wheel without them turns every startup
# completeness check into "no shipped workflow definition for job type ...",
# and the checksum comparison makes a mangled copy just as loud as a missing
# one.
"*" = ["*.toml"]

[tool.pytest.ini_options]
# THE THREE TIERS, DECLARED (required outcome 3). Until now the tiers were
# expressed as a hand-maintained module list inside
# `scripts/run-operational-tests.sh` and a filename convention (`live_*.py`)
# understood only by the humans invoking them. Markers make the tier a
# property of the test rather than of the list that happens to name it:
#
#   stub     — the existing tier: psycopg2/boto3 stubbed into sys.modules,
#              pure logic, no infrastructure. Runs anywhere.
#   contract — this brief's new tier: real PostgreSQL, real migration
#              schema, real transactions. Needs a database (PGHOST etc).
#   live     — the pre-existing manual tier (`live_*.py`), run by a human
#              against deployed infrastructure. NOT a gate.
#
# `run-operational-tests.sh` keeps its explicit module list for now — the
# brief requires the stubbed tier stay green unchanged during the
# transition, and retiring that list is a later step that these markers make
# possible rather than one this change makes.
markers = [
    "stub: pure-logic tests with psycopg2/boto3 stubbed (no infrastructure)",
    "contract: tests against a real PostgreSQL built from the migration stream",
    "live: manual tests against deployed infrastructure; never a gate",
]
# The contract tier is opt-IN. A bare `pytest` on a laptop or in a lint job
# must not try to open a database connection and fail for want of one — the
# CI job and the rapid-admin runner both select the tier explicitly with
# `-m contract`.
addopts = "-m 'not contract and not live'"
testpaths = ["pipeline", "observability", "submission", "database"]

[tool.ruff]
# Match the line length the existing code is written to.
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# T201 is selected repo-wide and then ignored everywhere it has not yet been
# earned. Ruff has no "select for these paths only" directive — per-file-ignores
# is the mechanism — so the ban is expressed as: on by default, waived on the
# unconverted trees. Each conversion worker deletes one waiver line, which
# makes the remaining waivers an accurate, shrinking inventory of what is still
# print()-based.
#
# "F" is pyflakes: real errors (undefined names, unused imports), safe to apply
# to code this old.
select = ["F", "T201"]

[tool.ruff.lint.per-file-ignores]
# --- T201 waivers: the unconverted trees --------------------------------
# 2,126 print() calls live under these paths. Enforcing the ban on all of them
# today would fail on every file and be switched off within a day; the ban is
# therefore enforced where the conversion has landed and waived where it has
# not. W3 converts the payload call sites, W5 the entrypoints — each deletes
# the waiver it makes obsolete.
# The payload scripts, which live directly in pipeline/ and are W3/W5's to
# convert.
#
# The pattern keys on the payload scripts' camelCase names — every one of
# them contains a capital (awsBatchSubmitJobs_*, registerCompletedJobsInDB,
# virtualPipelineOperator, ...) — because `runtime` does not, and a pattern
# that cannot match this package is the only kind that stays waived-off it.
#
# Three glob facts forced that shape, each established with
# `ruff check --verbose` (which names the pattern donating each ignore)
# against a probe file holding a bare print(), never assumed:
#   * ruff ACCUMULATES per-file-ignores across every matching pattern, so a
#     later entry — even an empty list — cannot subtract a waiver an earlier
#     pattern donated;
#   * `*` crosses directory separators here, so `pipeline/*.py` and
#     `pipeline/[a-z]*.py` both reach pipeline/runtime/;
#   * a `!`-negated key negates the file match, not the waiver, so it does
#     not carve an exception out either.
#
# If a payload script is ever added whose name is all-lowercase, this pattern
# will not waive it and its print() calls will fail the lint — the safe
# direction to be wrong in, and the fix is to name the file here explicitly
# rather than to widen the glob back over pipeline/runtime/.
"pipeline/?*[A-Z]*.py" = ["T201"]
"modules/**/*.py" = ["T201"]
"database/**/*.py" = ["T201"]
"sims/**/*.py" = ["T201"]
"alerts/**/*.py" = ["T201"]
"submission/**/*.py" = ["T201"]
"observability/**/*.py" = ["T201"]
"soc/**/*.py" = ["T201"]
"scripts/**/*.py" = ["T201"]
"c/**/*.py" = ["T201"]
"cdf/**/*.py" = ["T201"]
"aws/**/*.py" = ["T201"]
"RuBR/**/*.py" = ["T201"]

# Test and live-proof modules print deliberately: a live proof script's output
# IS its result, read by a human from an SSM invocation. Not the operational
# layer, so the ban does not apply.
"**/test/**" = ["T201"]
"**/tests/**" = ["T201"]

# --- pipeline/runtime/ is where the ban BITES ---------------------------
#
# There is deliberately NO entry for pipeline/runtime/ here. That is the whole
# mechanism: every waiver above is written so it cannot match this package,
# because ruff ACCUMULATES per-file-ignores across matching patterns and an
# empty list added later subtracts nothing. A waiver that reaches this
# directory can never be taken back — it has to not match in the first place.
#
# This was verified rather than assumed. A probe file containing a bare
# print() under pipeline/runtime/ passed `ruff check` cleanly while the
# waiver read `pipeline/*.py`, and `--verbose` named the pattern donating the
# ignore. Without that check the entire configuration would have been
# decoration: T201 selected, waived everywhere it could fire, enforced
# nowhere.
#
# Why the ban belongs here specifically: the runtime owns the one logging
# configuration (UTC timestamps, level, job/attempt identifiers via adapter,
# stdout stream handler plus per-stage file handlers). A print() here would
# bypass the safety stream, the per-stage bundle capture, and the redaction
# that travels with them — output invisible to an operator querying the stream
# live, and absent from the diagnostics bundle that outlives the container.

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "observability", "submission", "database"]
