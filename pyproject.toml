# Project and build configuration for the RAPID pipeline repository.
#
# requirements.txt stays the dependency authority: Dockerfiles install
# from it, and this file does not restate or replace it. This file exists
# so the repository is installable (pip install -e .) and packaged for
# distribution; the CI/lint configuration is a separate concern this file
# does not take on.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rapid-pipeline"
version = "0.1.0"
description = "RAPID -- Roman Alerts Promptly from Image Differencing"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.scripts]
rapidpipe = "rapidpipe.cli.main:main"

[tool.setuptools]
# Explicit package list, not auto-discovery: this tree also has docs, c,
# cdf, sims, soc and docker directories that are not importable packages,
# and setuptools' flat-layout auto-discovery refuses to guess among them.
packages.find = {include = [
    "pipeline*", "modules*", "database*", "alerts*", "aws*", "rapidpipe*",
]}

[tool.setuptools.package-data]
# rapidpipe/settings/ holds non-Python stage-defaults data (admit.toml and
# siblings to come), not an importable subpackage, so it needs an explicit
# package-data entry rather than being picked up by packages.find above.
# rapidpipe/selftest/fixtures/ is the packaged copy of each stage
# fixture's expected.json and settings.toml (rapidpipe.selftest.runner),
# needed so `rapidpipe selftest` can read them inside the pipeline image,
# which excludes tests/ at build time (containers/rapid-pipeline/build.sh).
rapidpipe = ["settings/*.toml", "selftest/fixtures/*/*.json", "selftest/fixtures/*/*.toml"]

[tool.pytest.ini_options]
# The test directories are not named after the import package: tests/unit
# and tests/db, not tests/rapidpipe and tests/rapidpipe_db. With the old
# names, tests/rapidpipe/ (a package, it has __init__.py, under a tests/
# that is not one) shadowed the real rapidpipe package whenever pytest put
# tests/ on sys.path -- seen first in the admit stage's CLI-dispatch test,
# then on a fleet workstation running the suite from a plain checkout with
# the pipeline's own interpreter, where every database test failed at
# collection with "No module named 'rapidpipe.db'". The importlib import
# mode alone did not clear it for a whole-tree collection. pythonpath = ["."]
# makes the checkout itself importable, so the suite runs the same way
# from a checkout, an editable install, or CI.
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
