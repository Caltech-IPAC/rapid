awaicgen_input_uncert_list_file = "refimage_unc_inputs.txt"
# awaicgen's thread count, from [AWAICGEN] in the master .ini
# (`5664024^:cdf/awsBatchSubmitJobs_launchSingleSciencePipeline.ini:167`) —
# the same W4B drop again, and the next KeyError
# `build_awaicgen_command_line_args` would have raised after the four
# geometry keys were supplied. Found by reading that function's full key
# list against this section rather than by a fifth ramp attempt.
awaicgen_num_threads = 2

# The four geometry keys `build_awaicgen_command_line_args` also reads —
# awaicgen_mosaic_size_x/y and awaicgen_RA_center/Dec_center — are
# deliberately NOT here. They are per-field, computed by
