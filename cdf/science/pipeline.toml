# RAPID science configuration — release content.
#
# THE THIRD CONFIGURATION HOME. Every configuration fact in RAPID lives in
# exactly one of three places (batch-payload co-design, Principles 4):
#
#   the pipeline parameter tree  /rapid/pipeline/* in SSM — operational
#                                configuration, mutable between releases
#   THIS FILE                    anything that can alter a science product
#   the submission manifest      per-invocation facts (which SCA, which
#                                exposure, which reference image)
#
# The placement criterion that sorts the first two: CAN THIS VALUE ALTER A
# SCIENCE PRODUCT? If yes, it is here. The reason is reproducibility, not
# tidiness: this file is carried by the image, so the image digest
# recorded in every attempt's provenance identifies these values exactly.
# A science-affecting value in the mutable tree would let a product's
# scientific identity change without any release changing, which makes the
# release identity insufficient to reproduce the product.
#
# WHY TOML. The values here were strings in a .ini and are typed here:
# `float` stays a float, `true` stays a boolean. tomllib is in the 3.11
# standard library, so this costs no dependency, and typing the values
# removes the scattered float()/int() coercions at each consumer, which
# is where a wrong parse hides. Chosen over YAML (needs a dependency,
# and its implicit typing is the opposite of what is wanted here) and
# over keeping .ini (untyped, and no nesting).
#
# HOW IT IS READ. pipeline/runtime/science_config.py — `load()` for the
# values, `digest()` for the content hash that goes into provenance
# alongside the image digest. Nothing else parses this file.
#
# WHAT IS NOT HERE. Output filenames, thread counts, verbosity, memory
# limits: operational, and none of them can change a science result. The
# `fill_in_by_launch_script` / `to_be_filled_by_script` placeholders that
# the master .ini carried are also absent — those slots hold
# per-invocation values, so they belong in the manifest, and carrying the
# sentinel would only move the landmine. `ppid` is absent because it is
# routing, single-homed in submission/routes.py.
#
# The SExtractor .conv / .nnw / .inp files beside this one in cdf/ are
# release content too, by location — they ship in the image and are
# identified by the same image digest. They are not restated here.
#
# PROVENANCE OF THESE VALUES. Extracted 2026-08-06 (W4) from
# cdf/awsBatchSubmitJobs_launchSingleSciencePipeline.ini, which remains in
# place and functional until W6 deletes it behind the cutover fence. The
# extraction was mechanical and value-preserving; the round-trip test in
# pipeline/runtime/test/test_science_config.py checks every key here
# against that .ini so the two cannot drift while both exist.

[release]
# Bumped when the science content of this file changes in a way that
# should be visible as a distinct configuration, independently of the
# image digest that identifies the file byte-for-byte.
schema_version = 1

[tessellation]
# THE ACTIVE SKY-TESSELLATION VERSION (W7, 2026-08-06).
#
# The tessellation assigns every source to a sky tile (rtid), so it is
# science-affecting by the plainest reading of the placement criterion: a
# different tessellation puts the same source in a different field, which
# changes what is coadded, what is matched, and what is forced-photometered.
# Switching versions is therefore a RELEASE change, pinned here — never
# in the mutable parameter tree, where a product's scientific identity
# could change without any release changing.
#
# `version` selects rows from rapid-db's `tessellation` table (see
# rapid_systems cloudformation/db-migrations/015-tessellation.sql).
# `digest` is the canonical content digest the builder produced for that
# version (rapid_systems tools/tessellation/build.py); it is recorded in
# provenance and is what a consumer checks the loaded rows against.
#
# Certification (rapid_systems tools/tessellation/certification-2026-08-06.txt)
# proved this tessellation REGULAR: rtid(ra, dec) is closed-form
# computable, so the pipeline computes it arithmetically and never queries
# a table on the hot path. The version pin still governs — it says WHICH
# rule and which row set the products were made against, and the access
# module refuses to run if the constants it computes from disagree with
# the pinned digest.
version = "nside512-v2"
digest = "ee5b7a614de1ca9a57483660ab47338219932bed9447a9345c48c360c8767cd9"
nside = 512
nrows = 6291458

[science]
# Relocated from the /rapid/pipeline/science/* parameter tree by W4
# (2026-08-06) — both failed the placement criterion.
#
# min_images_to_coadd: minimum input images for reference-image
# coaddition; below it the pipeline declines to launch. Coadd depth
# changes the reference image, and the reference image is an input to
# every difference made against it.
#
# NOTE A LIVE DIVERGENCE, recorded rather than silently resolved: the SSM
# tree carried 3 and the master .ini's [REF_IMAGE] carries
# min_n_images_to_coadd = 2. That is the duplication this re-homing
# exists to end. The tree's 3 is taken as authoritative here — it was the
# deliberate Q4 setting, and the .ini's 2 is the older value — and
# ref_image.min_n_images_to_coadd below is left at the .ini's 2 so the
# round-trip test still proves the extraction was faithful. The two
# converge when W5 switches the payload onto this file and the .ini key
# goes with the rest of the .ini at W6. Flagged for the owner: if 2 was
# in fact the intended operating value, this is the line to change.
min_images_to_coadd = 2

# diff_flavor: which differencing algorithm's image feeds the alert
# cutout — "sfft" or "zogy". Selects which science product a downstream
# consumer sees, so it is scientific identity by definition.
diff_flavor = "sfft"

