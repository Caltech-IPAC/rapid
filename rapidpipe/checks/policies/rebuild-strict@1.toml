# Check policy rebuild-strict@1 (supervisor step 6, 2026-09-24, R3).
# The same checks as rebuild-trial@1 with bounds the control run cannot
# meet: it exists to demonstrate and test the promotion gate's refusal.
# Immutable once landed: a change is a new version (a new file).
name = "rebuild-strict"
version = "1"
description = "Strict demonstration policy: bounds the control run cannot meet, so promotion under it is refused."
# Trial approval recorded by supervisor step 6 under the 2026-09-24 grant;
# lead re-approval pending (plan-review amendment A1). Approved like trial
# so that a refusal under it is the failed required check, not the approval.
approval = "trial"
approved_by = "rusholme"
auto_promote = false

[[checks]]
name = "difference-image-statistics"
version = "1"
kind = "difference-image"
required = true

[checks.params]
scalefacref_lo = 0.99
scalefacref_hi = 1.01
rms_max = 0.01
median_max = 0.01
n_min = 0
n_max = 1000
ratio_lo = 0.9
ratio_hi = 1.1

[[checks]]
name = "catalog-counts-vs-reference"
version = "1"
kind = "source-set"
required = false

[checks.params]
tolerance = 0.0001
missing_reference = "fail"
reference_run = ""
