# Default settings for the export stage (rapidpipe.stages.export).
#
# Ported from origin/dev's pipeline/generateSourceHATSCatalog.py
# (supervisor step 8, 2026-09-24, ruling R12), whose parameters come from
# the [HATS_CATALOGS] section of
# cdf/awsBatchSubmitJobs_launchSingleSciencePipeline.ini; each key below
# names the dev parameter it replaces and keeps dev's value unless it says
# otherwise. An overlay (--settings) may change values, never add keys: an
# unknown key fails with exit 64, the same as for any other stage.
#
# HATS stands for Hierarchical Adaptive Tiling Scheme (dev's catalog
# format, via `hats`/`hats-import`; rapid_systems'
# containers/rapid-pipeline build.sh carries these in the rapid-python
# conda-lock environment).

[export]
# What this attempt exports. Only "sources" (dev's
# generateSourceHATSCatalog.py) is built; "light-curves" (dev's
# generateLightCurveHATSCatalog.py) is the next port and exits 64 here.
catalog_type = "sources"

# Export only flags = 0 sources. dev exports every row (no flags filter
# in its SELECT), so the default is false.
flags_zero_only = false

# Rows per dumped CSV file (dev: nrows_per_file = 100000, hard-coded).
csv_rows_per_file = 100000

[hats]
# The catalog-export entry's format_version.
format_version = "1"

# Output catalog directory name under <outputs>/hats/ (dev:
# sources_catalog_name).
catalog_name = "sources_hats_catalog"

# hats-import ImportArguments.catalog_type. dev passes none, so
# hats-import's default "object" applies.
hats_catalog_type = "object"

# hats-import's healpix order range (dev: lowest_healpix_order = 2,
# highest_healpix_order = 9).
lowest_healpix_order = 2
highest_healpix_order = 9

# hats-import's rows-per-partition ceiling. dev passes none, so
# hats-import's default (1000000) applies.
pixel_threshold = 1000000

# hats-import ImportArguments.sort_columns, a list joined with ",". dev
# passes none (empty list here: not passed).
sort_columns = []

# dask local cluster: worker count (dev: n_workers = 1) and whether the
# workers are processes (dev: dask's default, true). false runs threads in
# this process -- the fixture's overlay uses it to keep the selftest fast.
n_workers = 1
dask_processes = true

# RA/Dec column names in the dumped rows (dev: sources_ra_col,
# sources_dec_col).
ra_col = "ra"
dec_col = "dec"

# The sources columns dumped, in order (dev: sources_cols, verbatim).
columns = ["sid", "id", "pid", "ra", "dec", "xfit", "yfit", "fluxfit", "xerr", "yerr",
           "fluxerr", "npixfit", "qfit", "cfit", "flags", "sharpness", "roundness1",
           "roundness2", "npix", "peak", "field", "hp6", "hp9", "expid", "fid", "sca",
           "mjdobs", "isdiffpos"]
