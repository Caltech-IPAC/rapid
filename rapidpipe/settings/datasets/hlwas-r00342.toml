# The overlay for dataset family r00342 (STScI's SOC HLWAS simulation, L2
# ASDF), given at `rapidpipe run create --overlay`. It holds only the keys
# whose value differs from the shipped defaults (foundation-thin.toml, dev's
# values) for this dataset, each with the measurement that earned it; a key
# the base does not have is refused (rapidpipe.foundation.layers). Locations
# and per-run values are not here: `intake.source_root` (the L2 prefix) and
# `reference.selection.before_mjd` (the bound, which differs per filter) come
# by `--set` at `run create`.

[intake]
# The SOC simulations sit in a public bucket, read anonymously: a Batch
# container read 204 MB unsigned in 0.8 s (runbook part 7 step 6, run 12).
unsigned = true
# #238's default mask 0x2110C03 without SATURATED 0x2: DO_NOT_USE 0x1, DEAD
# 0x400, HOT 0x800, NONLINEAR 0x10000, NO_LIN_CORR 0x100000, UNRELIABLE_FLAT
# 0x2000000 (LEDGER-fixes, run 17 pass 4, F146 SCA 8). Every isolated pixel
# above 1000 DN/s carries one of these bits and the reference-only spikes are
# all UNRELIABLE_FLAT, wild in all three reference frames, so no median or
# clip could reject them; SATURATED sits on the core of every star above
# about 100 DN/s, and #238's default cut 15 of 30 bright stars' aperture
# flux to 0.23 to 0.83 of the unmasked value.
dq_mask_bits = 0x2110C01
# The L2 WCS sits a constant (+0.12, -0.99) px from the stars, measured minus
# predicted: the simulation's own input catalog (Gaia DR3 positions at epoch
# 2016.0) through the file's gWCS, 30 stars, scatter 0.03 px, no trend
# across the frame, identical through the intake's SIP (F146 SCA 8 pass 4,
# 001_0001, LEDGER-wcs-input-catalog, 2026-10-24). The intake's
# gaia_dx_px / gaia_dy_px read it on every file.
crpix_shift = [0.12, -0.99]

[difference.sfft]
# dev's OpenUniverse block, read when [difference] diff_flavor = "sfft" (the
# published differencer stays ZOGY's). Measured on one epoch pair, 001_0001
# SCA 8 F146 pass 4 against run 81's reference, the same bytes (sfft-core,
# 2026-10-24): under the socsims block the stage's zeroed DQ-masked science
# cores (5,096 px, 0.03% of the frame, 31% of the sum of the reference's
# squared pixels) enter the kernel fit and pull its photometric ratio down,
# core fraction +0.251, ring +0.021; this block masks every source with
# FLUX_MAX >= 50 within 100 px and fits the 1.6% of pixels left on the
# segmentation's sources, cross-convolved: core -0.000, ring -0.009 (ZOGY
# -0.001, +0.002), S/N > 20 candidates 184 positive and 12 negative against
# 771 and 300, 179 of the epoch's 200 injected sources in its PSF-fit
# catalog against 130. Its reference catalog selects 62 sources and its
# decorrelation sigmas come from pixels 96% segmentation background, so
# neither of dev's ini caveats on this block holds here. The catalog path
# alone (sfft_use_gainmatch_catalogs = true at 20000) selects nothing and
# reproduces the socsims block to the digit.
crossconv_flag = true
sfft_use_segmentation = true
sfft_use_gainmatch_catalogs = true
sfft_bsmask_value = "50.0"
sfft_bsmask_radius = "100.0"
