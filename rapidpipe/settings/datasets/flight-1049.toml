# The overlay for Roman flight program 1049 ('RAPID CAR-198 Implementation',
# MAST L2 ASDF, romancal 1.0.2, roman_datamodels 1.0.0's wfi_image-2.0.0),
# given at `rapidpipe run create --overlay`. It holds only the keys whose
# value differs from the shipped defaults (foundation-thin.toml, dev's
# values) for this dataset, each with the measurement that earned it; a key
# the base does not have is refused (rapidpipe.foundation.layers). Locations
# and per-run values are not here: `intake.source_root` (the L2 prefix) and
# `reference.selection.before_mjd` (the bound) come by `--set` at `run
# create`. The measurements are runbook part 13 step flight-first's, the
# four F158 WFI02 epochs of observation 2 visit 1 (2026-10-24 10:56 to 11:02
# UTC, 60 s each), r0104901001001002001_000N_wfi02_f158.
#
# Read by the `soc-l2` reader unchanged: the same stem grammar, meta tree and
# DQ flag definitions as the SOC simulations, meta.photometry present (ZPTMAG
# 25.801), each file naming its CRDS ePSF (roman_wfi_epsf_0239 on all four).
# No WCS key: the file's gWCS (tweakreg against Gaia, 31 to 39 matches, rmse
# 0.013 to 0.015 px) puts Gaia DR3's stars at (-0.09 to -0.04, -0.06 to
# -0.04) px once their proper motions carry them to the frames' epoch
# (2026.81); at Gaia's own epoch 2016.0 they sit at (-0.08 to +0.16, -0.56
# to -0.35) px, the field's median proper motion (-4.2, -3.7 mas/yr) over
# 10.8 years, not the WCS: hence gaia_proper_motion below.

[intake]
# meta.observation.program; the exposures row's program_id is the
# producer's program number, negative only for the simulations.
program_id = 1049
# dq_mask_bits is the base's (no key): the files carry the same
# roman_datamodels pixel flags as the SOC simulations, so the bits mean the
# same. Without SATURATED the mask covers 0.231% of the pixels per file
# (DO_NOT_USE 0.039%, DEAD 0.097%, HOT 0.100%, NONLINEAR 0.105%, NO_LIN_CORR
# 0.116%, UNRELIABLE_FLAT 0.011%); 1.36% carry any flag, the largest
# unmasked GW_AFFECTED_DATA 0.370% (the guide window), UNRELIABLE_SLOPE
# 0.362% and OTHER_BAD_PIXEL 0.274%. SATURATED is on 0.001% to 0.002%, real
# saturated cores, so HLWAS's reason for leaving it out (every star core
# above about 100 DN/s flagged) does not hold here and the base masks it
# (Azalee, 2026-11-10). Of the 3,116 pixels above 10 sigma of their local
# background at the same detector position in all four frames (hot pixels:
# the sky moved with the dithers), the mask without SATURATED removes 2,644;
# of the 472 left, 341 carry no flag and no one more bit removes more than
# 72 (WARM), so no value here masks them.
# The sky moves: the intake's gaia_dx_px / gaia_dy_px carry Gaia DR3's stars
# by their proper motions to each frame's mid-exposure (runbook part 13 step
# gaia-pm). Without it run 118's intake read the field's proper motion,
# (-0.08 to +0.16, -0.56 to -0.35) px, as WCS offset; by hand the
# propagation puts the WCS at (-0.09 to -0.04, -0.06 to -0.04) px.
gaia_proper_motion = true

[difference.sci_image]
# False is meant for in-flight data, as commissioning a7778505 sets it, though its ini comment still says to enable it for real data (Azalee, 2026-11-10).
repair_extreme_artifact_pixels = false

[difference.sfft]
# The kernel-fit masking values, chosen by offline reruns of 20261021 req7
# jid95 (PID 1062, F062, WFI06),
# not measured on 1049: there the fit, on this base's OpenUniverse block,
# gave a kernel sum of 1.050 (negative/positive 0.755), dominated by one
# saturated star and by the zero-filled DQ-masked pixels, of which about
# 500 to 1,250 inside source footprints carried 22% to 29% of the fit's
# (sci - ref)^2. With zero margin 2 and isoarea 2000 / isofactor 2.0 the
# kernel sum was 0.997 and the bright-star residuals largely gone; a star
# whose missing saturated core leaves FLUX_MAX at 176 DN/s has ISOAREA
# 143,000 px^2, radius 427 px. jid95 was tuned with SATURATED masked, as
# the base dq_mask_bits masks it (Azalee, 2026-11-10).
sfft_zero_margin = "2"
sfft_bsmask_isoarea = "2000"
sfft_bsmask_isofactor = "2.0"
# Commissioning's [SFFT] value (dev 025e42b3's socsims setting, carried onto commissioning, not a flight measurement): no cross-convolution, SFFT's difference PSF is the science PSF (Azalee, 2026-11-10).
crossconv_flag = false

[difference.gainmatch]
# Commissioning a7778505's thresholds, which effectively remove the gain-match magnitude cut (AB scale, zprefimg added once) (Azalee, 2026-11-10).
magrefthresmin = 10.0
magrefthresmax = 30.0
refmagkeep = 30.0

[difference.psfcat_diffimage]
# DAOStarFinder's sharpness ceiling; 1.8 admits more extended detections into the difference sources than dev's 1.0, set from analysis of on-orbit data, as commissioning a7778505 (Azalee, 2026-11-10).
sharphi = 1.8
