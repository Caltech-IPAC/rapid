# The overlay for RimTimSim's 2026-06-22 delivery (TRExS's simulator, one
# Galactic-bulge field, dev's field 4682737, SCA 2, F087 and F213), read as
# dev's converted `_lite.fits.gz` files, given at `rapidpipe run create
# --overlay`. It holds only the keys whose value differs from the shipped
# defaults (foundation-thin.toml, dev's values) for this dataset, each with
# the measurement that earned it; a key the base does not have is refused
# (rapidpipe.foundation.layers). `intake.source_root` (the lite prefix) and
# `reference.selection.before_mjd` come by `--set` at `run create`. The
# measurements are runbook part 13 step rimtimsim-reader's, file
# rimtimsim_WFI_F213_SCA02_000000411_lite unless named.

[intake]
# dev's converter's output: the image in DN in HDU 1, a CD-matrix TAN-SIP
# WCS with zero SIP terms, ZPTMAG per filter (rapidpipe.science.intake_rimtimsim).
reader = "rimtimsim"
# surveys: (-3, 'RimTimSims', 'SIM'), dev's db_register_rimtimsim_files.py.
program_id = -3

[psf.epsf]
# The file names no ePSF reference. CRDS's operational context roman_0077
# answers these for WFI02 at the field's start time (get_best_references,
# 2026-10-24). On 60 isolated stars of the file the F213 stamp leaves a
# residual 0.024 of the stack's peak inside 8 px (0.022 transposed: the
# stamp is within 0.0017 of its own transpose). dev transposes the science
# PSF for RimTimSim (2025-05-30); measured on epoch 4571 against the same
# reference (runs 99 and 101), ZOGY's core -0.0694 -> -0.0688, ring -0.0339
# -> -0.0385: not taken, no setting.
F087 = "roman_wfi_epsf_0266.asdf"
F213 = "roman_wfi_epsf_0280.asdf"

[difference.instrument]
# dev's [INSTRUMENT] rimtimsims block: the converter writes DN at gain 1.
sca_gain = 1.0
sca_readout_noise = 11.0

[difference.sci_image]
# dev's [SCI_IMAGE] rimtimsims value: the simulation's rate saturation, 20000
# DN/s x 55 s; the brightest pixel of the file is 1,085,418 DN.
saturation_level = 1100000.0
# dev leaves the artefact repair off for the rimtimsims (no cosmic rays, hot
# or dead pixels, no DQ): its 10000 DN/s threshold is below the stars' cores,
# and the file's 99.99th-percentile pixel is 14,600 DN/s.
repair_extreme_artifact_pixels = false
