# ported-from: cdf/awsBatchSubmitJobs_launchSingleSciencePipeline.ini @ d6aac515
# The settings body of a foundation run over the thin field (foundation
# plan v5, milestones 1 to 4): `rapidpipe run create --settings` stores it
# whole on the run, and each stage reads its own table from the run. Values
# are dev's, named where dev hard-codes them. Data locations are never
# here: the import's source directory is its job's scope, the outputs root
# is RAPIDPIPE_OUTPUTS_ROOT.

[import]
# The brightest sources kept per difference image, by fluxfit / fluxerr.
max_sources = 500
# dev's fit-position bounds, in pixels (loadPSFCatIntoDBSourcesTable.py L35-36).
xy_fit_min = -0.5
xy_fit_max_offset = 0.5
# dev's l2files.limmag backfill (db_backfill_l2files_limmag.py defaults).
limmag_nsigma = 5.0
limmag_clip_sigma = 3.0
limmag_maxiters = 10

[intake]
# The source root (an s3:// or file:// prefix holding <stem>_cal.asdf) is the
# run's: `source_root` in the overlay given at `run create`, never here.
# Read the source root anonymously (a public bucket).
unsigned = false
# dev's ingestL2Files.py: SIPDISTORTIONDEGREE's default, to_fits_sip's
# max_pix_error, L2GZIPLEVEL's default (PR 291).
sip_degree = 5
sip_max_pix_error = 0.1
gzip_level = 1
# dev's RAPIDDATASOURCE = SOCSIMS program_id (rapidOpsSurveysInserts.sql).
program_id = -1
# dev's l2files.limmag, as [import] has it.
limmag_nsigma = 5.0
limmag_clip_sigma = 3.0
limmag_maxiters = 10
# DQ bits whose pixels the conversion sets NaN in SCI, ERR and VAR_*
# (commissioning #238's DQMASKBITS, pipeline/dqMaskSubs.py). 0 is dev's
# behaviour: nothing masked, DQ written and never read.
dq_mask_bits = 0

[intake.nominal_zptmag]
# dev's nominal WFI AB zeropoints [mag], used only when the file carries no
# meta.photometry.
F062 = 26.4
F087 = 26.3
F106 = 26.4
F129 = 26.3
F146 = 27.5
F158 = 26.4
F184 = 25.9
F213 = 25.4

[psf]
# New, not dev's: the psf stage (rapidpipe.stages.psf) fetches the CRDS ePSF
# reference an L2 file names from this server, by name, and reduces it to a
# size x size stamp at the detector's pixel scale. size is the copied F146
# WebbPSF files' NAXIS1 (sciimage_psf_f146_sca08.fits, 61).
crds_server = "https://roman-crds.stsci.edu"
size = 61

[associate]
# Degrees (dev's crossmatch match_radius).
match_radius = 0.00001528
# Sources matched: flags equal to this, and fluxfit / fluxerr at least min_snr.
source_flags = 0
min_snr = 5.0

[packet]
edge_pixels = 2
# Cutouts are (2 * half width + 1) pixels square (dev providers.py STAMP_HALF_WIDTH).
stamp_half_width = 64
# Days before the trigger (dev PRV_WINDOW_DAYS, FORCED_WINDOW_DAYS).
prv_window_days = 365.25
forced_window_days = 30.0
# Gaia DR3 matches (dev providers.py): radius in arcseconds, at most this many.
gaia_radius_arcsec = 1.0
gaia_max_matches = 3
# Reference-catalog star and galaxy matches (dev providers.py), likewise.
refcat_radius_arcsec = 5.0
refcat_max_matches = 3

[batch.memory_mib]
# New, not dev's: the memory each stage's Batch job asks for (a
# resourceRequirements override of the one job definition's 24 GiB), the
# 2026-10-21 ramp's measured peaks times about two, rounded (PR 308: intake
# 910 MiB, reference 2,831, difference 16,125, associate 238, packet 867).
# The difference keeps the definition's 24 GiB and its headroom. A stage
# with no key gets the job definition's value.
intake = 2048
reference = 6144
difference = 24576
associate = 1024
packet = 2048
# New: the psf stage holds one 178.6 MB ePSF reference and its 42 MB array.
psf = 2048

[kafka]
# New, not dev's: `rapidpipe publish` produces official packet sets to the
# topic. The SSM parameter names, never their values: the deployment holds
# the cluster's bootstrap servers (IAM auth), the topic and the largest
# request the producer may send.
bootstrap_servers_parameter = "/rapid/scratch/kafka/bootstrap-servers"
topic_parameter = "/rapid/scratch/kafka/topic"
max_request_bytes_parameter = "/rapid/scratch/kafka/max-request-bytes"

# The reference stage (rapidpipe.stages.reference), one subtable per dev
# ini section. Every value is the dev default the ported step reads, from
# origin/dev's cdf/awsBatchSubmitJobs_launchSingleSciencePipeline.ini at
# 6458d3ca (the master config the reference launcher reads, section named
# beside each table), unless the comment says it is new. Moved here from
# rapidpipe/settings/reference.toml with the stage's port to run(job).
# The file's pin is d6aac515, the difference stage's refresh; three
# reference keys still hold their 6458d3ca values, left for the
# reference stage's own refresh from dev and marked where they stand:
# [reference.mosaic] naxis1/naxis2 (9100 since dev 1518042b) and
# [reference.sextractor_refimage] deblend_nthresh/seeing_fwhm (32 and 0.25
# since dev ce485e8f).
[reference.paths]
# `dev`: rapid_sw = "/code", cfg_path = rapid_sw + "/cdf" (hard-coded in
# awsBatchSubmitJobs_runSingleReferenceImagePipeline.py); the SExtractor
# parameter, filter and star/galaxy files are the packaged
# cdf/rapidSexParamsRefImage.inp, cdf/rapidSexRefImageFilter.conv and
# cdf/rapidSexRefImageStarGalaxyClassifier.nnw (referenceImageSubs.py
# generateSExtractorReferenceImageCatalog). The pipeline image copies the
# repository to /code.
rapid_sw = "/code"
cfg_path = "/code/cdf"
# `dev` calls both by bare name on PATH (rapid-awaicgen and
# rapid-sextractor RPMs install into /opt/rapid/bin).
awaicgen = "awaicgen"
sextractor = "sex"
# Where the published files go, beneath the attempt's prefix.
# New (`dev` works in the job's current directory). The reformatted
# inputs and awaicgen's list files are written to a scratch directory
# outside the output location and never published, as `dev` never uploads
# them (referenceImageSubs.py: upload_inputs = False).
work_subdirectory = "ref"

[reference.selection]
# [REF_IMAGE] min_n_images_to_coadd, max_n_images_to_coadd. Fewer input
# frames than min_frames fails the job; frames past max_frames in mjdobs
# order are not coadded (`dev` breaks its loop) and the manifest names them.
min_frames = 2
max_frames = 25
# before_mjd (a float, absent by default): the loop builds a field's
# reference only from its official L2 rows with mjdobs < before_mjd, once
# the selection's intake has drained, and differences only the rows at or
# after it; absent, a reference coadds every epoch (rapidpipe.foundation.loop).

[reference.instrument]
# [INSTRUMENT] (socsims values), as [difference.instrument].
sca_gain = 2.0
sca_readout_noise = 9.4

[reference.mosaic]
# [REF_IMAGE] naxis1_refimage, naxis2_refimage, cdelt1_refimage,
# cdelt2_refimage, crota2_refimage. `dev`'s launcher sets awaicgen's
# -X/-Y to |cdelt1| * naxis1 and |cdelt1| * naxis2 (degrees) and -C to
# crota2; awaicgen truncates size / pixel scale to the pixel count, so
# cdelt is kept exactly as `dev` writes it rather than derived from the
# 0.11 arcsec pixel scale ([awaicgen] awaicgen_pixelscale_absolute).
# dev 1518042b: 9100 (not taken; see above).
naxis1 = 7000
naxis2 = 7000
cdelt1 = -0.000030555555556
cdelt2 = 0.000030555555556
rotation = 0.0
# Mosaic centre, degrees. Empty (the default) = the centre of the unit's
# Roman tessellation tile from the closed-form tessellation
# (rapidpipe.science.spatial.field_center), as `dev`'s launcher uses
# roman_tessellation_db.get_center_sky_position(rtid). New as a setting.
ra_center = ""
dec_center = ""

[reference.awaicgen]
# [AWAICGEN], every key `dev`'s launcher passes through, with `dev`'s
# values. awaicgen_mosaic_size_x/_y, awaicgen_ra_center/_dec_center and
# awaicgen_mosaic_rotation are "to_be_filled_by_script" in the ini and are
# filled from [mosaic] as `dev`'s launcher fills them.
awaicgen_input_images_list_file = "refimage_sci_inputs.txt"
awaicgen_input_uncert_list_file = "refimage_unc_inputs.txt"
awaicgen_pixelscale_factor = 1.0
awaicgen_pixelscale_absolute = 0.11
awaicgen_mos_cellsize_factor = 0.5
awaicgen_drizzle_factor = 1.0
awaicgen_inv_var_weight_flag = 0
awaicgen_pixelflux_scale_flag = 1
awaicgen_simple_coadd_flag = 1
awaicgen_num_threads = 2
awaicgen_unc_sigfigs_retained = 1
awaicgen_output_mosaic_image_file = "awaicgen_output_mosaic_image.fits"
awaicgen_output_mosaic_cov_map_file = "awaicgen_output_mosaic_cov_map.fits"
awaicgen_output_mosaic_uncert_image_file = "awaicgen_output_mosaic_uncert_image.fits"
awaicgen_debug = 0
awaicgen_verbose = 1
# The reference-image zero point per filter (AB, the socsim medians; see
# the ini's comment block), keyed by the RAPID filter name lower-cased;
# either spelling of a frame's FILTER resolves (`dev`'s
# get_reference_image_zeropoint). The scalar is the fallback for a filter
# with no entry of its own.
zprefimg_r062 = 25.8939023158
zprefimg_z087 = 25.5924495668
zprefimg_y106 = 25.6351909166
zprefimg_j129 = 25.6306327632
zprefimg_h158 = 25.6549325807
zprefimg_f184 = 25.1999194557
zprefimg_k213 = 25.1449429981
zprefimg_w146 = 26.8630336165
zprefimg = 17.0

[reference.psfcat]
# [PSFCAT_REFIMAGE]. `dev`'s Photutils reference catalog needs a
# reference PSF input the input set does not carry yet; designed in, off,
# not produced in this build (reference page). true fails the job. The table's
# other values are `dev`'s, kept for when it is ported.
enabled = false
n_clip_sigma = "3.0"
n_thresh_sigma = "5"
fwhm = "2.0"
fit_shape = "(17, 17)"
aperture_radius = "8"
sharplo = "0.2"
sharphi = "1.0"
roundlo = "-1.0"
roundhi = "1.0"
min_separation = "1.0"
output_psfcat_filename = "refimage_psfcat.txt"
output_psfcat_finder_filename = "refimage_psfcat_finder.txt"
output_psfcat_residual_filename = "refimage_psfcat_residual.fits"

[reference.fake_sources]
# [FAKE_SOURCES]. Fake-source injection into the reference inputs is a
# test-only branch in `dev` and is not ported; true fails the job.
inject_fake_sources_flag = false

[reference.statistics]
# New: seed for the clipped-statistics correction factor's Monte Carlo
# draw (as [difference.statistics]). Negative reproduces `dev`, which draws from
# numpy.random unseeded. Pinned as the difference stage's is, so the same
# frames give the same reference catalog (foundation/night-fixes); whether
# the reference stage varied run to run without it was not demonstrated.
clip_correction_seed = 0

# [SEXTRACTOR_REFIMAGE] verbatim (generated from the ini; configparser's
# lower-case keys). The per-call values `dev` fills in -- detection and
# input image, WEIGHT_IMAGE, PARAMETERS_NAME, FILTER_NAME, STARNNW_NAME,
# CATALOG_NAME -- are set by the stage exactly as
# generateSExtractorReferenceImageCatalog sets them; the params, filter
# and nnw files come from [paths] cfg_path.
[reference.sextractor_refimage]
sextractor_input_image = "fill_in_by_launch_script"
sextractor_catalog_name = "fill_in_by_launch_script"
sextractor_catalog_type = "ASCII_HEAD"
sextractor_parameters_name = "fill_in_by_pipeline_script"
sextractor_detect_type = "CCD"
sextractor_detect_minarea = "5"
sextractor_detect_maxarea = "0"
sextractor_thresh_type = "RELATIVE"
sextractor_detect_thresh = "2.5"
sextractor_analysis_thresh = "2.5"
sextractor_filter = "Y"
sextractor_filter_name = "fill_in_by_pipeline_script"
sextractor_filter_thresh = "100"
sextractor_deblend_nthresh = "4"
sextractor_deblend_mincont = "0.005"
sextractor_clean = "Y"
sextractor_clean_param = "1.0"
sextractor_mask_type = "CORRECT"
sextractor_weight_type = "MAP_RMS,MAP_RMS"
sextractor_rescale_weights = "Y"
sextractor_weight_image = "weight.fits"
sextractor_weight_gain = "N,N"
sextractor_weight_thresh = "1000000"
sextractor_flag_image = "fill_in_by_launch_script"
sextractor_flag_type = "OR"
sextractor_phot_apertures = "2.0,3.0,4.0,6.0,10.0,14.0"
sextractor_phot_autoparams = "2.5,3.5"
sextractor_phot_petroparams = "2.0,3.5"
sextractor_phot_autoapers = "0.0,0.0"
sextractor_phot_fluxfrac = "0.25,0.5,0.75,0.85,0.95,0.99,0.999"
sextractor_satur_level = "100000.0"
sextractor_satur_key = "SATURATE"
sextractor_mag_zeropoint = "0.0"
sextractor_mag_gamma = "4.0"
sextractor_gain = "999999999999999.9"
sextractor_gain_key = "GAIN"
sextractor_pixel_scale = "0"
sextractor_seeing_fwhm = "1.2"
sextractor_starnnw_name = "fill_in_by_pipeline_script"
sextractor_back_type = "AUTO"
sextractor_back_value = "0.0"
sextractor_back_size = "512"
sextractor_back_filtersize = "3"
sextractor_backphoto_type = "LOCAL"
sextractor_backphoto_thick = "15"
sextractor_back_filtthresh = "0.0"
sextractor_checkimage_type = "NONE"
sextractor_checkimage_name = "check.fits"
sextractor_memory_objstack = "3000"
sextractor_memory_pixstack = "300000"
sextractor_memory_bufsize = "1024"
sextractor_assoc_name = "sky.list"
sextractor_assoc_data = "2,3,4"
sextractor_assoc_params = "2,3,4"
sextractor_assoccoord_type = "PIXEL"
sextractor_assoc_radius = "2.0"
sextractor_assoc_type = "NEAREST"
sextractor_assocselec_type = "MATCHED"
sextractor_verbose_type = "NORMAL"
sextractor_header_suffix = ".head"
sextractor_write_xml = "N"
sextractor_nthreads = "1"
sextractor_fits_unsigned = "N"
sextractor_interp_maxxlag = "16"
sextractor_interp_maxylag = "16"
sextractor_interp_type = "ALL"

# The difference stage (rapidpipe.stages.difference), one subtable per dev
# ini section, from origin/dev's cdf/awsBatchSubmitJobs_launchSingleSciencePipeline.ini
# at d6aac515 (section named beside each table), unless the comment says
# it is new. Moved here from rapidpipe/settings/difference.toml with the
# stage's port to run(job). Port principle (lead, 2026-09-22): minimise
# differences to `dev`. Tool options `dev` passes on a command line are
# kept as the strings its configuration holds.
[difference]
# The brightest sources kept per difference image, by fluxfit / fluxerr,
# as [import] max_sources; 0 keeps every source.
max_sources = 500
# dev's fit-position bounds, in pixels (loadPSFCatIntoDBSourcesTable.py L35-36).
xy_fit_min = -0.5
xy_fit_max_offset = 0.5

[difference.paths]
# `dev`: rapid_sw = "/code", cfg_path = rapid_sw + "/cdf" (hard-coded in
# the script). The pipeline image copies the repository to /code.
rapid_sw = "/code"
cfg_path = "/code/cdf"
# The interpreter that runs py_zogy.py. `dev` hard-codes
# /usr/bin/python3.11; empty means the interpreter running this stage
# (the rebuild image's conda environment). New.
python = ""
zogy_code = "/code/modules/zogy/v21Aug2018/py_zogy.py"
# `dev`: rapid_sw + "/c/bin/bkgest" and rapid_sw + "/c/include". The
# rebuild pipeline image does not carry `dev`'s /code/c tree; its bkgest
# comes from the rapid-cmodules RPM (rapid_systems
# rpms/rapid-cmodules/rapid-cmodules.spec), which installs the binary at
# the flat /opt/rapid/bin prefix every rapid-* RPM uses (already on PATH,
# like sextractor/swarp below) and bkgest's own runtime message catalogue
# (bkgest_errcodes.h, read by -a at run time to decode a status code, not
# merely compiled in) at /opt/rapid/share/bkgest. Confirmed live against
# the pipeline image (LEDGER-fixture-real.md, 2026-09-23): the /code/c
# paths do not exist there; /opt/rapid/bin/bkgest does.
bkgest_code = "bkgest"
bkgest_include_dir = "/opt/rapid/share/bkgest"
# `dev` calls these by bare name on PATH.
sextractor = "sex"
swarp = "swarp"
# Where the stage's working files and products go, beneath the attempt's
# output location. New (`dev` works in the job's current directory).
work_subdirectory = "diff"

[difference.instrument]
# [INSTRUMENT] (socsims values).
sca_gain = 2.0
sca_readout_noise = 9.4

[difference.sci_image]
# [SCI_IMAGE]. Saturation level in DN.
saturation_level = 2500000.0
repair_extreme_artifact_pixels = true
extreme_artifact_threshold = 10000.0

[difference.ref_image]
# `dev` reads this from [SEXTRACTOR_REFIMAGE] sextractor_SATUR_LEVEL.
saturation_level = 100000.0

[difference.awaicgen]
# [AWAICGEN] zprefimg: an explicit override of the reference-image zero
# point gain matching uses. Empty (the default) means the stage reads the
# zero point from the reference image's own MAGZP header keyword, the
# value the reference stage stamped when it built the coadd (the lead,
# 2026-09-26: gain matching reads the reference it is given rather than a
# fixed setting). A non-empty value here overrides the header, whether or
# not the header carries one; the stage logs which source was used.
zprefimg = ""

[difference.zogy]
# [ZOGY]. Gain matching's fallback x/y RMS when too few sources match.
astrometric_uncert_x = 0.05
astrometric_uncert_y = 0.05
# ZOGY's astrometric-uncertainty inputs (dx = dy), registered as
# dxrmsfin/dyrmsfin. New as a setting; 0.0 reproduces `dev`, which
# overrides the measured RMS with 0.0 ("2025-08-15 Jacob's
# recommendation").
astrometric_sigma = 0.0
post_zogy_keep_diffimg_lower_cov_map_thresh = 0.5
zogy_sn_sr_from_uncertainty_maps = true
zogy_output_diffimage_file = "zogy_diffimage.fits"
zogy_output_diffpsf_file = "diffpsf.fits"
zogy_output_scorrimage_file = "scorrimage.fits"

[difference.sfft]
# [SFFT] (socsims block).
run_sfft = true
crossconv_flag = false
sfft_bsmask_value = "20000.0"
sfft_bsmask_radius = "30.0"
sfft_use_gainmatch_catalogs = false
sfft_use_segmentation = false
sfft_code = "/code/modules/sfft/sfft_rapid_rimtimsim.py"
# The interpreter that runs sfft_code; empty means the interpreter
# running this stage (the pipeline image's main conda environment, where
# sfft is installed), as [paths] python means for ZOGY. `dev` hard-codes
# python3.11 in its own /sfft_env virtual environment. New default.
python_cmd = ""
# The shell command to activate SFFT's environment before running it (and
# to deactivate after, joined by " && "); empty means no activation, no
# deactivation -- run python_cmd directly. `dev` hard-codes
# "source /sfft_env/bin/activate" for its own venv image. New default.
activate_cmd = ""
# SFFT runs as `dev` runs it; its files stay under the job's prefix and
# are not published as rows (a run has one differencer: ZOGY).

[difference.naive_diffimage]
# [NAIVE_DIFFIMAGE]. The naive subtraction runs as `dev` runs it and is
# never published as rows.
naive_diffimage_flag = true
naive_output_diffimage_file = "naive_diffimage_masked.fits"

[difference.bkgest]
# [BKGEST]; command-line strings.
clippedmean_calc_type = "3"
output_image_type = "2"
local_clippedmean_grid_spacing = "500"
local_clippedmean_input_window = "501"
filename_bkg_subbed_science_image = "bkg_subbed_science_image.fits"
filename_global_clippedmean_sciimage_tbl = "global_clippedmean_science_image.tbl"
# dev 4350bb5d: the resampled reference is background-subtracted by the
# same bkgest (with [swarp] swarp_subtract_back = "N").
subtract_from_reference = true
filename_global_clippedmean_refimage_tbl = "global_clippedmean_reference_image.tbl"

[difference.gainmatch]
# [GAINMATCH] (socsims/rimtimsims thresholds). `dev`'s
# upload_intermediate_products is S3-only and not ported.
verbose = 1
zero_point_sci_keyword = "ZPTMAG"
magrefthresmin = 19.0
magrefthresmax = 24.0
refexclbox = 10.5
refmagkeep = 23.5
edgebuffer = 100
numsrcgmatchmin = 20
radscirefmatch = 1.0
# dev aa795b22: no CLASS_STAR cut for the socsims.
min_class_star_thresh = 0.0
max_isoareaf_image_thresh = 100
max_awin_to_bwin_world_ratio_thresh = 1.3

[difference.psfcat_diffimage]
# [PSFCAT_DIFFIMAGE].
n_clip_sigma = 3.0
n_thresh_sigma = 5.0
fwhm = 2.0
fit_shape = [17, 17]
aperture_radius = 8.0
sharplo = 0.2
sharphi = 1.0
roundlo = -1.0
roundhi = 1.0
min_separation = 1.0
output_zogy_psfcat_filename = "zogy_diffimage_masked_psfcat.txt"
output_zogy_psfcat_finder_filename = "zogy_diffimage_masked_psfcat_finder.txt"
output_zogy_psfcat_residual_filename = "zogy_diffimage_masked_psfcat_residual.fits"
output_sfft_psfcat_filename = "sfftdiffimage_masked_psfcat.txt"
output_sfft_psfcat_finder_filename = "sfftdiffimage_masked_psfcat_finder.txt"
output_sfft_psfcat_residual_filename = "sfftdiffimage_masked_psfcat_residual.fits"
output_naive_psfcat_filename = "naive_diffimage_masked_psfcat.txt"
output_naive_psfcat_finder_filename = "naive_diffimage_masked_psfcat_finder.txt"
output_naive_psfcat_residual_filename = "naive_diffimage_masked_psfcat_residual.fits"

[difference.fake_sources]
# [FAKE_SOURCES]. Fake-source injection is not ported; true is refused
# (exit 64) until it is.
inject_fake_sources_flag = false

[difference.statistics]
# New: seed for the clipped-statistics correction factor's Monte Carlo
# draw. Negative reproduces `dev`, which draws from numpy.random unseeded,
# so the clipped standard deviations move by about 3e-4 between runs, and
# with them the uncertainty images, S_corr and the PSF-fit threshold: on
# identical inputs epoch 84624 gave 5,539, 5,542 and 5,544 sources. Pinned
# so the same inputs give the same rows (foundation/determinism).
clip_correction_seed = 0

