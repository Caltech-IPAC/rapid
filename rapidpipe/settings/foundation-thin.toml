sextractor_flag_image = "fill_in_by_launch_script"
sextractor_flag_type = "OR"
sextractor_phot_apertures = "2.0,3.0,4.0,6.0,10.0,14.0"
sextractor_phot_autoparams = "2.5,3.5"
sextractor_phot_petroparams = "2.0,3.5"
